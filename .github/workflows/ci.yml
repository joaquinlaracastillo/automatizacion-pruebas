name: Java CI - Build y Pruebas Automatizadas

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar proyecto
        run: mvn clean compile

      - name: Ejecutar pruebas unitarias e integración
        run: mvn test

      - name: Guardar reportes de pruebas
        uses: actions/upload-artifact@v5
        with:
          name: reporte-pruebas
          path: target/surefire-reports/

      - name: Guardar reporte BDD de Cucumber
        uses: actions/upload-artifact@v4
        with:
          name: reporte-bdd-cucumber
          path: target/cucumber-reports/cucumber.html