name: Java CI - Pruebas Automatizadas y BDD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar y ejecutar pruebas unitarias y BDD
        run: mvn test

      - name: Guardar reportes de pruebas unitarias
        uses: actions/upload-artifact@v5
        with:
          name: reporte-pruebas-unitarias
          path: target/surefire-reports/

      - name: Guardar reporte BDD de Cucumber
        uses: actions/upload-artifact@v5
        with:
          name: reporte-bdd-cucumber
          path: target/cucumber-reports/cucumber.html
